# SPDX-License-Identifier: GPL-3.0-or-later
# Dumps an AMD CPU's rcpps as the libmvec log/log10 tables (CPPWRF's tools/libmvec_tables.py, which by default
# accepts only Intel). The mesoscale_reference physics call glibc's SSE4 vector log through libmvec, and its rcpps step
# differs between Intel and AMD CPUs. The RG references come from AMD runners (ci/host.sh), so the port needs AMD's
# table. The job fails on an Intel runner; dispatch it again until it gets an AMD one.
name: libmvec AMD tables
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag for the header (e.g. libmvec-amd-001)
        required: true
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      CPPWRF_COMMIT: 7fac5bfaac1c5c11af3c64c3f04731af90d617b3
      TOOL_SHA256: ae8b79df641baad345bf9a7068bc852dd4327fc10ffa1a7299e0144311a38c83
      GLIBC_SHA256: a5a26b22f545d6b7d7b3dd828e11e428f24f4fac43c934fb071b6a7d0828e901
    steps:
      - name: CPU
        run: |
          vendor=$(awk -F': ' '/^vendor_id/ {print $2; exit}' /proc/cpuinfo)
          awk -F': ' '/^model name/ {print $2; exit}' /proc/cpuinfo | tee cpu.txt
          [ "$vendor" = AuthenticAMD ] || { echo "Intel runner ($vendor): dispatch again for an AMD one"; exit 1; }
      - name: Tool and glibc source (pinned)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Xassemblianist/CPPWRF/$CPPWRF_COMMIT/tools/libmvec_tables.py" -o libmvec_tables.py
          echo "$TOOL_SHA256  libmvec_tables.py" | sha256sum -c -
          curl -fsSLO https://ftp.gnu.org/gnu/glibc/glibc-2.41.tar.xz
          echo "$GLIBC_SHA256  glibc-2.41.tar.xz" | sha256sum -c -
          tar xJf glibc-2.41.tar.xz glibc-2.41/sysdeps/x86_64/fpu
          # the one change: take this CPU's (AMD's) rcpps instead of refusing a non-Intel CPU, and label the header
          python3 - <<'PY'
          from pathlib import Path
          p = Path("libmvec_tables.py"); s = p.read_text()
          a = 'if vendor != "GenuineIntel":\n        sys.exit(f"not an Intel CPU ({vendor}): the table must be Intel\'s rcpps")'
          assert s.count(a) == 1
          s = s.replace(a, 'if vendor != "AuthenticAMD":\n        sys.exit(f"not an AMD CPU ({vendor})")')
          s = s.replace("from glibc 2.41's sources and Intel's rcpps", "from glibc 2.41's sources and AMD's rcpps")
          p.write_text(s)
          PY
      - name: Dump
        run: |
          python3 libmvec_tables.py glibc-2.41 > libmvec_tables_amd.hpp
          curl -fsSL "https://raw.githubusercontent.com/Xassemblianist/CPPWRF/$CPPWRF_COMMIT/src/core/libmvec_tables.hpp" -o libmvec_tables_intel.hpp
          if cmp -s <(grep -v 'rcpps dumped on\|GENERATED' libmvec_tables_amd.hpp) <(grep -v 'rcpps dumped on\|GENERATED' libmvec_tables_intel.hpp); then
            echo "AMD tables EQUAL Intel's" | tee result.txt
          else
            echo "AMD tables DIFFER from Intel's" | tee result.txt
            diff <(grep -A40 kRcpSteps libmvec_tables_intel.hpp) <(grep -A40 kRcpSteps libmvec_tables_amd.hpp) | head -40 || true
          fi
          sha256sum libmvec_tables_amd.hpp | tee -a result.txt
      - name: Publish
        run: |
          gh release create "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --title "${{ inputs.tag }}: libmvec log tables from $(cat cpu.txt)" \
            --notes "glibc 2.41 libmvec SSE4 log/log10 tables with this AMD CPU's rcpps ($(cat cpu.txt)), generated by CPPWRF tools/libmvec_tables.py at $CPPWRF_COMMIT with only the vendor check changed. $(head -1 result.txt)." \
            libmvec_tables_amd.hpp result.txt cpu.txt
